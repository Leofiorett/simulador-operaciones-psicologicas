services:
  - type: web
    name: sop-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SOP_SECRET_KEY
        generateValue: true
      - key: SOP_SRC_DIR
        value: /app/src
      - key: SOP_DATA_DIR
        value: /app/data
      - key: DATABASE_URL
        fromDatabase:
          name: sop-db
          property: connectionString

databases:
  - name: sop-db
    databaseName: sop
    user: sop
